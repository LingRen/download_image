name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      # 未配置 secrets 时跳过，build.gradle.kts 会自动回退 debug 签名。
      - name: 还原 Android 签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64，回退 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.jks"
          } > android/key.properties

      # 版本以 tag 为准（v1.0.1 -> 1.0.1）；workflow_dispatch 没有 tag 时回退 pubspec。
      - name: 解析版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml)
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "版本号：${version}"

      - run: flutter pub get
      - run: flutter build apk --release --build-name="$VERSION"

      # Flutter 默认产物名是 app-release.apk，改成与 macOS / Windows 一致的命名。
      - name: 重命名 APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/download_image-${VERSION}-android.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/download_image-*.apk
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: 解析版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml)
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "版本号：${version}"

      - run: flutter pub get
      - run: flutter build macos --release --build-name="$VERSION"
      # package_macos.sh 会读取环境变量 VERSION 决定 dmg 文件名。
      - run: bash scripts/package_macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: 解析版本号
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml)
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "版本号：${version}"

      - run: flutter pub get
      - run: flutter build windows --release --build-name="$VERSION"

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 编译安装器
        shell: pwsh
        run: |
          Write-Host "版本号：$env:VERSION"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" "windows\installer\download_image.iss"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: windows/installer/Output/*.exe
          if-no-files-found: error

  release:
    needs: [android, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/android-apk/*.apk
            artifacts/macos-dmg/*.dmg
            artifacts/windows-installer/*.exe
          generate_release_notes: true
